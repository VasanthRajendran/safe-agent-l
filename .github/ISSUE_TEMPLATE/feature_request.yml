name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the feature. What are you governing, and where does the current library fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the API or behavior to look like? Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or why existing features don't fit.
  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, with guidance"
        - "Yes, independently"
        - "No"
    validations:
      required: true
