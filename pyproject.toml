[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-agent-l"
version = "0.1.0"
description = "A reference implementation of the SAFE-AGENT-L governance framework for autonomous AI agent systems: legal compliance by design, explainability, defense-in-depth safety, and network-aware resilience."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vasanth Rajendran", email = "vasanthr430@gmail.com" }
]
keywords = [
    "ai-safety",
    "ai-governance",
    "autonomous-agents",
    "explainability",
    "responsible-ai",
    "multi-agent-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/vasanthr430/safe-agent-l"
Issues = "https://github.com/vasanthr430/safe-agent-l/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
