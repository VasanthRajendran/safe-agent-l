[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-agent-l"
version = "0.2.0"
description = "Runtime enforcement library for autonomous AI agent systems: constraint enforcement, auditable decision traces, defense-in-depth safety controls, and fail-closed network resilience."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vasanth Rajendran", email = "vasanthr430@gmail.com" }
]
keywords = [
    "ai-safety",
    "ai-governance",
    "autonomous-agents",
    "guardrails",
    "runtime-enforcement",
    "explainability",
    "auditability",
    "responsible-ai",
    "multi-agent-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/VasanthRajendran/safe-agent-l"
Documentation = "https://github.com/VasanthRajendran/safe-agent-l/tree/main/docs"
Source = "https://github.com/VasanthRajendran/safe-agent-l"
Changelog = "https://github.com/VasanthRajendran/safe-agent-l/blob/main/CHANGELOG.md"
Security = "https://github.com/VasanthRajendran/safe-agent-l/blob/main/SECURITY.md"
Issues = "https://github.com/VasanthRajendran/safe-agent-l/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeagentl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
files = ["src/safeagentl"]
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["safeagentl"]

[tool.coverage.report]
show_missing = true
